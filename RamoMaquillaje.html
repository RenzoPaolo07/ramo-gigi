<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>💄 Día del Ramo de Maquillaje · Para Gigi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0612;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      -webkit-tap-highlight-color: transparent;
    }

    .font-serif { font-family: 'Playfair Display', serif; }

    /* ===== SOBRE SORPRESA ===== */
    #envelope-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #1a1025 0%, #0a0612 100%);
      transition: opacity 1s ease, visibility 1s ease;
      cursor: pointer;
    }
    #envelope-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-scene {
      perspective: 1200px;
      position: relative;
    }

    .envelope {
      position: relative;
      width: 300px;
      height: 210px;
      transform-style: preserve-3d;
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #fdf2f8, #fce7f3);
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(236,72,153,0.4), 0 0 60px rgba(236,72,153,0.2);
    }

    .envelope-body {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      overflow: hidden;
    }

    .envelope-flap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 105px;
      background: linear-gradient(180deg, #fce7f3, #fbcfe8);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      border-radius: 12px 12px 0 0;
    }
    .envelope-flap.open {
      transform: rotateX(180deg);
    }

    .letter {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: 270px;
      height: 180px;
      background: linear-gradient(180deg, #ffffff, #fdf2f8);
      border-radius: 8px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .letter-content { text-align: center; padding: 16px; }
    .letter-content .heart-icon { font-size: 44px; margin-bottom: 8px; display: block; }
    .letter-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px; color: #be185d; margin: 0 0 6px;
    }
    .letter-content p { font-size: 12px; color: #9d174d; margin: 0; opacity: 0.8; }

    .envelope-heart {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 54px;
      z-index: 6;
      animation: heartbeat 1.6s infinite;
      filter: drop-shadow(0 4px 20px rgba(236,72,153,0.8));
    }
    @keyframes heartbeat {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      14% { transform: translate(-50%, -50%) scale(1.18); }
      28% { transform: translate(-50%, -50%) scale(1); }
      42% { transform: translate(-50%, -50%) scale(1.18); }
      56% { transform: translate(-50%, -50%) scale(1); }
    }

    .envelope-hint {
      margin-top: 50px;
      text-align: center;
      color: #f9a8d4;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: fadeHint 2s infinite;
      font-weight: 500;
    }
    @keyframes fadeHint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* ===== CANVAS 3D ===== */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* ===== HEADER ===== */
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      padding: 30px 20px 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease 0.5s;
    }
    #header.visible { opacity: 1; }

    #header .badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      background: rgba(236,72,153,0.15);
      border: 1px solid rgba(236,72,153,0.4);
      color: #f9a8d4;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }

    #header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: #fff;
      text-shadow: 0 0 30px rgba(236,72,153,0.6), 0 0 60px rgba(236,72,153,0.3);
      line-height: 1.1;
      margin-bottom: 8px;
    }
    #header h1 span {
      color: #f472b6;
    }

    #header p {
      color: rgba(249,168,212,0.7);
      font-size: 0.85rem;
      font-weight: 400;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(10, 6, 18, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: linear-gradient(180deg, #ffffff, #fdf2f8);
      border-radius: 30px;
      padding: 34px 26px 26px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      position: relative;
      transform: scale(0.85) translateY(30px);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 40px 100px rgba(236,72,153,0.4), 0 0 0 1px rgba(255,255,255,0.6);
    }
    .modal-overlay.open .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-img-ring {
      width: 100px;
      height: 100px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, #f472b6, #a855f7);
      box-shadow: 0 10px 30px rgba(236,72,153,0.5);
    }
    .modal-img-ring img {
      width: 100%; height: 100%; object-fit: cover;
      border-radius: 50%; border: 3px solid #fff; display: block;
    }

    .modal-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #f9a8d4, transparent);
      margin: 18px 0;
    }

    .modal-close {
      position: absolute;
      top: 14px; right: 14px;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(0,0,0,0.05);
      color: #831843;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      border: none; cursor: pointer;
    }
    .modal-close:hover { background: rgba(236,72,153,0.15); }

    .btn-save {
      margin-top: 22px;
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(236,72,153,0.5);
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-save:active { transform: scale(0.96); }
    .btn-save:hover { box-shadow: 0 8px 32px rgba(236,72,153,0.65); }

    /* ===== LOADING ===== */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0612;
      color: #f9a8d4;
      font-size: 14px;
      letter-spacing: 2px;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    /* ===== FOOTER ===== */
    #footer {
      position: fixed;
      bottom: 16px;
      left: 0; right: 0;
      text-align: center;
      z-index: 10;
      color: rgba(249,168,212,0.35);
      font-size: 10px;
      letter-spacing: 2px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease 0.8s;
    }
    #footer.visible { opacity: 1; }

    @media (max-width: 420px) {
      #header h1 { font-size: 1.9rem; }
      #header .badge { font-size: 9px; }
    }
  </style>
</head>
<body>

  <!-- LOADING -->
  <div id="loading">Cargando tu sorpresa...</div>

  <!-- SOBRE SORPRESA -->
  <div id="envelope-overlay">
    <div class="envelope-scene">
      <div class="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-body">
          <div class="letter">
            <div class="letter-content">
              <span class="heart-icon">💐</span>
              <h2>Para Gigi</h2>
              <p>Un ramo especial para ti...</p>
            </div>
          </div>
          <div class="envelope-flap" id="envelopeFlap"></div>
        </div>
        <div class="envelope-heart">💌</div>
      </div>
    </div>
    <p class="envelope-hint">Toca para abrir</p>
  </div>

  <!-- CONTENEDOR 3D -->
  <div id="canvas-container"></div>

  <!-- HEADER -->
  <header id="header">
    <span class="badge">✦ Día del Ramo de Maquillaje ✦</span>
    <h1>¡Feliz Día, <span>Gigi</span>!</h1>
    <p>Toca cada producto de tu ramo</p>
  </header>

  <!-- FOOTER -->
  <footer id="footer">
    Hecho con cariño desde Cusco para Puno 💕
  </footer>

  <!-- MODAL -->
  <div class="modal-overlay" id="message-modal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <div class="modal-img-ring">
        <img id="modal-img" src="" alt="Producto">
      </div>

      <h2 id="modal-title" class="font-serif text-2xl font-bold text-pink-900">Título</h2>

      <div class="modal-divider"></div>

      <div class="bg-pink-50/70 rounded-2xl p-4 border border-pink-100">
        <p id="modal-text" class="text-[13px] text-slate-700 leading-relaxed font-medium italic">
          Mensaje
        </p>
      </div>

      <button class="btn-save" onclick="closeModal()">
        Guardar en mi corazón ✨
      </button>
    </div>
  </div>

  <!-- Three.js desde CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ===== DATOS =====
    const makeupData = {
      mascara: {
        title: "Rímel",
        text: "Un rímel... para resaltar esos hermosos ojos en los que me perdí en el malecón de Miraflores",
        img: "https://belcorpperu.vtexassets.com/arquivos/ids/628254-800-800?v=639282946775700000&width=800&height=800&aspect=true",
        color: 0xbe185d
      },
      lipstick: {
        title: "Labial",
        text: "Un labial... por esa sonrisa que iluminó nuestra noche en Miraflores y que me hace sonreir cada vez que la recuerdo",
        img: "https://cloudinary.images-iherb.com/image/upload/f_auto,q_auto:eco/images/rvn/rvn00495/y/12.jpg",
        color: 0xdc2626
      },
      blush: {
        title: "Rubor",
        text: "Un rubor... porque me encanta cuando te sonrojas al hablar, reirnos y ser nosotros mismos sin filtros",
        img: "https://soybissu.com/wp-content/uploads/2024/09/cover-3.jpg",
        color: 0xf472b6
      },
      eyeliner: {
        title: "Delineador",
        text: "Un delineador... para enmarcar esa mirada que conectó con la mía más allá de una amistad y que me hace sentir que todo es posible",
        img: "https://cloudinary.images-iherb.com/image/upload/f_auto,q_auto:eco/images/wnw/wnw11509/y/29.jpg",
        color: 0x1e293b
      },
      palette: {
        title: "Sombras",
        text: "Unas sombras... para darle aún más color a esta historia que recién empieza entre nosotros y veas que la vida es más bonita a tu lado",
        img: "https://assets.dolcebella.com/p56-1.webp.webp",
        color: 0xa855f7
      }
    };

    // ===== ESCENA =====
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0612, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a0612, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // ===== CONTROLES =====
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.minDistance = 8;
    controls.maxDistance = 20;
    controls.minPolarAngle = Math.PI * 0.25;
    controls.maxPolarAngle = Math.PI * 0.75;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.target.set(0, 1.5, 0);

    // ===== LUCES =====
    const ambient = new THREE.AmbientLight(0xfdf2f8, 0.6);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 10, 7);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xf472b6, 2);
    rimLight.position.set(-6, 4, -5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xa855f7, 1.5, 30);
    fillLight.position.set(0, -3, 5);
    scene.add(fillLight);

    const topGlow = new THREE.PointLight(0xec4899, 2, 25);
    topGlow.position.set(0, 8, 0);
    scene.add(topGlow);

    // ===== PARTÍCULAS DE FONDO (GALAXIA) =====
    function createGalaxy() {
      const count = 3000;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color1 = new THREE.Color(0xf472b6);
      const color2 = new THREE.Color(0xa855f7);
      const color3 = new THREE.Color(0xfbbf24);

      for (let i = 0; i < count; i++) {
        const radius = 15 + Math.random() * 30;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.6;
        positions[i * 3 + 2] = radius * Math.cos(phi);

        const c = Math.random() < 0.5 ? color1 : (Math.random() < 0.5 ? color2 : color3);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      return new THREE.Points(geo, mat);
    }
    const galaxy = createGalaxy();
    scene.add(galaxy);

    // ===== RAMO =====
    const bouquet = new THREE.Group();
    bouquet.position.y = 0.5;
    scene.add(bouquet);

    // --- TALLOS ---
    const stemMat = new THREE.MeshStandardMaterial({
      color: 0x4d7c0f,
      roughness: 0.8,
      metalness: 0.1
    });

    const stemPositions = [
      [-0.8, 0, 0.1], [-0.4, 0, -0.2], [0, 0, 0.3],
      [0.4, 0, -0.1], [0.8, 0, 0.2], [0.2, 0, -0.4],
      [-0.2, 0, 0.4], [0.6, 0, -0.3]
    ];

    stemPositions.forEach(([x, , z], i) => {
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.05, 4.5, 6),
        stemMat
      );
      stem.position.set(x * 0.6, -0.5, z);
      stem.rotation.z = (Math.random() - 0.5) * 0.15;
      stem.rotation.x = (Math.random() - 0.5) * 0.1;
      bouquet.add(stem);

      // Hojitas
      if (i % 2 === 0) {
        const leaf = new THREE.Mesh(
          new THREE.SphereGeometry(0.12, 6, 4),
          new THREE.MeshStandardMaterial({ color: 0x65a30d, roughness: 0.7 })
        );
        leaf.scale.set(1, 0.3, 0.6);
        leaf.position.set(x * 0.6 + (Math.random() - 0.5) * 0.3, -1.5 - Math.random(), z);
        bouquet.add(leaf);
      }
    });

    // --- CONO DE PAPEL ---
    const paperMat = new THREE.MeshStandardMaterial({
      color: 0xfce4ec,
      roughness: 0.6,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    const paperCone = new THREE.Mesh(
      new THREE.ConeGeometry(2.2, 3.2, 32, 1, true),
      paperMat
    );
    paperCone.position.y = 0.8;
    paperCone.rotation.x = Math.PI;
    bouquet.add(paperCone);

    // Borde del papel (toro)
    const paperRim = new THREE.Mesh(
      new THREE.TorusGeometry(2.2, 0.06, 8, 32),
      new THREE.MeshStandardMaterial({ color: 0xf9a8d4, roughness: 0.5 })
    );
    paperRim.position.y = 0.8 + 1.6;
    paperRim.rotation.x = Math.PI / 2;
    bouquet.add(paperRim);

    // --- CINTA ---
    const ribbonMat = new THREE.MeshStandardMaterial({
      color: 0xec4899,
      roughness: 0.4,
      metalness: 0.2,
      emissive: 0xec4899,
      emissiveIntensity: 0.3
    });

    const ribbon = new THREE.Mesh(
      new THREE.TorusGeometry(1.1, 0.12, 12, 32),
      ribbonMat
    );
    ribbon.position.y = 1.2;
    ribbon.rotation.x = Math.PI / 2;
    bouquet.add(ribbon);

    // Lazo (dos esferas achatadas)
    const bowL = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 12),
      ribbonMat
    );
    bowL.scale.set(1.4, 0.7, 0.5);
    bowL.position.set(-0.55, 1.2, 1.1);
    bowL.rotation.z = 0.4;
    bouquet.add(bowL);

    const bowR = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 16, 12),
      ribbonMat
    );
    bowR.scale.set(1.4, 0.7, 0.5);
    bowR.position.set(0.55, 1.2, 1.1);
    bowR.rotation.z = -0.4;
    bouquet.add(bowR);

    const bowCenter = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 12, 10),
      new THREE.MeshStandardMaterial({ color: 0xbe185d, roughness: 0.3 })
    );
    bowCenter.position.set(0, 1.2, 1.2);
    bouquet.add(bowCenter);

    // ===== PRODUCTOS DE MAQUILLAJE (FLORES) =====
    const products = [];

    // Función para crear un producto 3D con esfera brillante
    // Necesitas cargar la textura primero
    const textureLoader = new THREE.TextureLoader();

    function createProduct(config) {
      const group = new THREE.Group();

      // Cargar la imagen como textura
      const texture = textureLoader.load(config.img);

      // Esfera con la imagen aplicada
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(config.radius, 32, 24),
        new THREE.MeshStandardMaterial({
          map: texture,           // 👈 la imagen en la esfera
          roughness: 0.45,
          metalness: 0.2,
          emissive: config.color,
          emissiveIntensity: 0.5
        })
      );
      group.add(sphere);

      // Anillo brillante alrededor
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(config.radius * 1.15, 0.04, 8, 32),
        new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.6
        })
      );
      ring.rotation.x = Math.PI / 2;
      group.add(ring);

      // Halo brillante (sprite)
      const haloMat = new THREE.SpriteMaterial({
        color: config.color,
        transparent: true,
        opacity: 0.1,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const halo = new THREE.Sprite(haloMat);
      halo.scale.set(config.radius * 5, config.radius * 5, 1);
      group.add(halo);

      group.position.copy(config.position);
      group.userData = {
        key: config.key,
        baseY: config.position.y,
        floatSpeed: 0.5 + Math.random() * 0.5,
        floatPhase: Math.random() * Math.PI * 2,
        baseScale: 1
      };

      bouquet.add(group);
      products.push(group);
      return group;
    }

    // Crear los 5 productos
    createProduct({
      key: 'eyeliner', color: 0x1e293b, radius: 0.55, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQScuKW4e0OP2BD9Iy6qecR2nkLri5aEOsZnrWqE9gKXoYodSZgolMwZlw&s=10",
      position: new THREE.Vector3(-1.7, 2.5, 0.6)
    });
    createProduct({
      key: 'mascara', color: 0xbe185d, radius: 0.62, img: "https://www.maybelline.pe/-/media/project/loreal/brand-sites/mny/americas/latam/tips-and-trends/eye-makeup-tutorials/our-best-mascara-for-sensitive-eyes/shot-1_800x1067.jpg?rev=4d0e7116af7d4b31a19ed18ec330e4ab",
      position: new THREE.Vector3(-0.9, 3.2, -0.3)
    });
    createProduct({
      key: 'palette', color: 0xa855f7, radius: 0.75, img: "https://www.yanbal.com/medias/20013424-01.jpg?context=bWFzdGVyfGltYWdlc3wzNDM5OTR8aW1hZ2UvanBlZ3xhR1JsTDJnMU5pOHhNRE14T1RjeU1Ea3pPVFUxTUM4eU1EQXhNelF5TkY4d01TNXFjR2N8NjQ3OGI0MDgyZjYzN2UwMmM1NWNjNDNhODQ1MTI1NGQwMmZhYmE0Y2I5YzhiNjJhZGQyY2ZkYzMwMzk5ODM0NA",
      position: new THREE.Vector3(0, 3.6, 0.2)
    });
    createProduct({
      key: 'blush', color: 0xf472b6, radius: 0.62, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBZCi17Hy772v4XK_2Il-_owkQ7R2yuXkiWXjaSKSIo-F6BPiqGsRkg4A&s=10",
      position: new THREE.Vector3(0.9, 3.2, -0.3)
    });
    createProduct({
      key: 'lipstick', color: 0xdc2626, radius: 0.55, img: "https://www.reneecosmetics.in/cdn/shop/files/Stay_Forever.jpg?v=1776235008&width=1946",
      position: new THREE.Vector3(1.7, 2.5, 0.6)
    });

    // ===== RAYCAST PARA CLICK =====
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredProduct = null;

    function onPointerMove(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(products, true);

      if (intersects.length > 0) {
        // Encontrar el grupo padre
        let obj = intersects[0].object;
        while (obj.parent && !products.includes(obj)) obj = obj.parent;
        if (obj && products.includes(obj)) {
          hoveredProduct = obj;
          document.body.style.cursor = 'pointer';
          return;
        }
      }
      hoveredProduct = null;
      document.body.style.cursor = 'grab';
    }

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(products, true);

      if (intersects.length > 0) {
        let obj = intersects[0].object;
        while (obj.parent && !products.includes(obj)) obj = obj.parent;
        if (obj && products.includes(obj)) {
          openModal(obj.userData.key);
        }
      }
    }

    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerdown', onPointerDown);

    // ===== POST-PROCESAMIENTO (BLOOM) =====
    const composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.35,  // strength (antes 1.2) -> Brillo mucho más suave
      0.4,   // radius (antes 0.6)   -> Halo más pequeño
      0.85   // threshold (antes 0.15) -> Solo brilla lo MUY blanco
    );
    composer.addPass(bloomPass);

    // ===== MODAL =====
    const modal = document.getElementById('message-modal');

    window.openModal = function(key) {
      const data = makeupData[key];
      document.getElementById('modal-img').src = data.img;
      document.getElementById('modal-title').textContent = data.title;
      document.getElementById('modal-text').textContent = `"${data.text}"`;
      modal.classList.add('open');
    };

    window.closeModal = function() {
      modal.classList.remove('open');
    };

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // ===== SOBRE SORPRESA =====
    const envelopeOverlay = document.getElementById('envelope-overlay');
    const envelopeFlap = document.getElementById('envelopeFlap');
    const header = document.getElementById('header');
    const footer = document.getElementById('footer');
    let opened = false;

    envelopeOverlay.addEventListener('click', () => {
      if (opened) return;
      opened = true;
      envelopeFlap.classList.add('open');

      setTimeout(() => {
        envelopeOverlay.classList.add('hidden');
        header.classList.add('visible');
        footer.classList.add('visible');
        // Iniciar animación de entrada del ramo
        bouquet.scale.set(0.1, 0.1, 0.1);
        bouquet.userData.revealing = true;
        bouquet.userData.revealStart = performance.now();
      }, 900);
    });

    // ===== LOADING =====
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 500);
    });

    // ===== RESIZE =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // ===== ANIMACIÓN =====
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const delta = clock.getDelta();

      // Rotar galaxia
      galaxy.rotation.y = t * 0.02;
      galaxy.rotation.x = Math.sin(t * 0.1) * 0.05;

      // Flotar productos
      products.forEach((p, i) => {
        const ud = p.userData;
        p.position.y = ud.baseY + Math.sin(t * ud.floatSpeed + ud.floatPhase) * 0.15;
        p.rotation.y = t * 0.3 + i;
        p.rotation.x = Math.sin(t * 0.5 + i) * 0.15;

        // Escala en hover
        let targetScale = 1;
        if (hoveredProduct === p) targetScale = 1.3;
        if (p.scale.x < targetScale) p.scale.setScalar(p.scale.x + 0.08);
        else if (p.scale.x > targetScale) p.scale.setScalar(p.scale.x - 0.08);
      });

      // Revelar ramo
      if (bouquet.userData.revealing) {
        const elapsed = (performance.now() - bouquet.userData.revealStart) / 1000;
        const s = Math.min(1, elapsed / 1.5);
        const eased = 1 - Math.pow(1 - s, 3);
        bouquet.scale.setScalar(0.1 + eased * 0.9);
        if (s >= 1) {
          bouquet.userData.revealing = false;
          bouquet.scale.setScalar(1);
        }
      }

      // Rotar ramo suavemente
      bouquet.rotation.y = Math.sin(t * 0.3) * 0.15;

      controls.update();
      composer.render();
    }

    animate();
  </script>
</body>
